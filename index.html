<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狙い目ノート</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="狙い目ノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
/* 狙い目ノート（2026-11-17）：グループのノートを写した、見るためのページ。並びはノートと同じ（日付→画像→文→もっと見る）
   版2：書く形と見せ方を型にした（写真・台名・ポイント・追記・ツールリンク・サイトリンク・内容・やめ時）
   版3：ツールリンクの「期待値表:名前」の行を、押すとアプリの中で期待値表が開くボタンにした
   版4：期待値表の中の道具（バジリスク絆2天膳の差枚計算）が入れた数字を、このスマホに残す
   版5：投稿の文の中の用語に点線と小さい「？」。押すと説明の吹き出し（2026-11-25）
   版6：題の右の3本線で、ノート・メモ（1人1人の、このスマホの中だけのメモ）・用語集・問題集（準備中）を切り替える（2026-11-25）
   版7：投稿の文の中の 差枚・MY・有利区間・有利区間切断・リセット は「？」でなく青い字にし、押すと用語集のその説明へ飛ぶ（2026-11-25）
   版8：用語集の差枚とMYに、オーナーが送ったグラフの画像（本日・−1500枚まで下がって＋2000枚）を使った図と説明を入れた（2026-11-25）
   版9：用語集の有利区間と有利区間切断に、グラフの道具で数字から作ったグラフの図と説明を入れた（2026-11-25）
   版10：3本線を上の帯の左はしへ。用語集のリセットに、オーナーが撮った BB 0・RB 0 の表記の写真（切り取り・位置情報なし）を入れた（2026-11-25）
   版11：「？」と点線をやめ、色だけにした。吹き出しだけの16語は薄めの青、用語集へ飛ぶ5つは薄めの赤（2026-11-27）
   版12：投稿の頭の台の名前を薄めの緑にし、押すと台の説明（天井と、G数に関わる示唆のタイミング）の吹き出し。説明は合言葉の奥の「_台の情報」（2026-11-27）
   版15：画像つきの言葉（レア役・AT・AT終了画面・アイキャッチ）は黄色にし、吹き出しに写真を出す（2026-11-27）
   版16：「示唆」を青い言葉にし、説明の下に例として AT終了画面 の写真。用語集にも足した（2026-11-27）
   版17：用語集の文も、吹き出しと同じく言葉のまとまりの間でだけ改行する（2026-11-27）
   版18：版15の4語（レア役・AT・AT終了画面・アイキャッチ）は青に戻す（写真はそのまま）。黄色はこのあと送られる言葉から（2026-11-27）
   版19：台ごとの黄色の言葉（TPOST）。その投稿の中の言葉だけを黄色にし、押すとグラフの道具で作った画像と説明。1つめは聖闘士星矢黄金十二宮の「上位後」（2026-11-28。画像はオーナーの「写真通りで」で見本の1段目と同じ数字に。「基本12連」はオーナーの言葉で「12連以上後」に）。2つめはゴッドイーターの「ハンニバル敗北後」（2026-11-28。印は137G・43枚のAT。オーナー「左から5個目137g43枚が表記だ」「現在1gを追加して完成」）。3つめはシャーマンキングの「pt計算」、4つめは牙狼 闇を照らす者の「SGB後」（2026-11-28。オーナー「RBからAT４連がラッシュ」で言い方をRBに）。5つめはとある魔術の禁書目録2の「画面右下g数が緑or赤」で、オーナーの写真を切り取って出す（説明の文なし） */
:root{
  --bg:#eef0f3; --card:#fff; --line:#e3e5e9; --ink:#1f2328; --sub:#8b9099; --link:#3d6ee0;
  --head:#fff; --chip:#f2f3f5; --dark:#000;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hide{display:none!important}

/* 上の帯 */
header{position:sticky;top:0;z-index:5;background:var(--head);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.bar{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto}
.bar h1{font-size:17px;margin:0 0 0 -2px;font-weight:700}
#tabBtn{margin-left:-8px}
.bar .sp{flex:1}
.icon-btn{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:#555}
.icon-btn:active{background:var(--chip)}
.search{max-width:640px;margin:8px auto 0;position:relative}
.search input{width:100%;border:0;background:var(--chip);border-radius:10px;padding:9px 34px 9px 34px;font-size:16px;color:var(--ink);outline:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--sub)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:13px;color:var(--sub);font-size:18px}
.count{max-width:640px;margin:6px auto 0;font-size:12px;color:var(--sub)}

/* 投稿 */
main{max-width:640px;margin:0 auto;padding:10px 10px calc(env(safe-area-inset-bottom) + 90px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 10px;overflow:hidden}
.meta{display:flex;align-items:center;padding:12px 14px 10px;min-height:44px}
.meta time{font-size:12px;color:var(--sub);flex:1}
.dots{width:32px;height:28px;border-radius:6px;color:var(--sub);font-size:18px;line-height:1}
.dots:active{background:var(--chip)}
.ph{display:grid;gap:2px;background:var(--card)}
.ph .t{position:relative;overflow:hidden;background:#e9ebee;cursor:zoom-in}
.ph .t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .2s}
.ph .t img.on{opacity:1}
.ph .t .more-n{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;font-size:24px;display:grid;place-items:center}
.ph.n1 .t{aspect-ratio:var(--ar,1.6);max-height:78vh}
.ph.n2{grid-template-columns:1fr 1fr}
.ph.n2 .t{aspect-ratio:1}
.ph.nm{grid-template-columns:repeat(3,1fr)}
.ph.nm .t{aspect-ratio:1}
.ph.nm .t:first-child{grid-column:1/-1;aspect-ratio:1.6}
.body{padding:12px 14px 4px}
.body.clamp{max-height:12.8em;overflow:hidden}
.nm{font-size:16px;font-weight:700;line-height:1.5;margin:0 0 6px;overflow-wrap:anywhere}
.sec{margin:0 0 8px}
.lb{font-size:12px;font-weight:600;color:var(--sub);margin:0 0 1px}
.tx{font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.tx a{color:var(--link);word-break:break-all}
.tx .hy{display:inline-block;margin:2px 0;padding:7px 12px;border-radius:8px;background:#eaf0fd;color:var(--link);font-size:14px;font-weight:600;line-height:1.4;text-align:left}
.tx .hy:active{background:#d8e3fb}
.more{display:block;padding:0 14px 12px;font-size:14px;color:var(--link)}
.foot{height:10px}
.empty{text-align:center;color:var(--sub);padding:48px 0;font-size:14px}

/* 書くボタン */
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:56px;height:56px;border-radius:28px;
  background:#2b3a55;color:#fff;font-size:30px;line-height:56px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}

/* 画像を大きく見る */
.viewer{position:fixed;inset:0;background:var(--dark);z-index:20;display:flex;flex-direction:column}
.vtop{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;font-size:14px}
.vtop button{color:#fff;width:40px;height:40px;font-size:26px}
.slides{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.slide{flex:0 0 100%;height:100%;overflow-y:auto;scroll-snap-align:start;display:flex;flex-direction:column}
.slide img{width:100%;height:auto;margin:auto 0;display:block}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;color:#fff;font-size:30px;background:rgba(255,255,255,.08)}
.arrow.l{left:0}.arrow.r{right:0}
@media (hover:none){.arrow{display:none}}

/* 期待値表を見る */
.hyv{position:fixed;inset:0;background:#fff;z-index:22;display:flex;flex-direction:column}
.htop{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 4px) 8px 4px;border-bottom:1px solid var(--line)}
.htop button{width:40px;height:40px;font-size:26px;color:#555;flex:none}
.htop b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hyv iframe{flex:1;min-height:0;width:100%;border:0;background:#f6f7f9}
.hwait{position:absolute;left:24px;right:24px;top:42%;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}

/* 合言葉・書く・メニューの画面 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.panel{background:#fff;width:100%;max-width:640px;border-radius:14px 14px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.panel h2{font-size:17px;margin:0 0 6px}
.panel p{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.5}
.field{width:100%;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}
.field:focus{border-color:#9db3e8}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border-radius:10px;background:#2b3a55;color:#fff;font-size:16px;font-weight:600}
.btn.sub{background:var(--chip);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.5}
.msg{color:#c4372f;font-size:13px;min-height:18px;margin-top:8px}
.lock{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.lock .panel{border-radius:14px;max-width:400px}
.menu .btn{margin-top:8px}

.compose{position:fixed;inset:0;background:#fff;z-index:35;display:flex;flex-direction:column}
.ctop{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
.ctop b{font-size:16px}
.ctop button{padding:8px 10px;font-size:15px}
.ctop .send{color:#fff;background:#2b3a55;border-radius:8px;font-weight:600}
.cbody{flex:1;overflow-y:auto;padding:4px 12px calc(env(safe-area-inset-bottom) + 40px)}
.fl{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:14px 0 5px}
.fi{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;line-height:1.6;
  font-family:inherit;color:var(--ink);outline:none;resize:none;background:#fff}
.fi:focus{border-color:#9db3e8}
textarea.fi{min-height:5.4em;overflow:hidden}
textarea.fi.big{min-height:11em}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.strip .p{position:relative;width:88px;height:88px;border-radius:6px;overflow:hidden;background:#eee}
.strip .p img{width:100%;height:100%;object-fit:cover}
.strip .p button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:24px}
.pick{margin-top:6px;color:var(--sub);font-size:15px;-webkit-appearance:none;appearance:none}
.addimg{width:88px;height:88px;border-radius:6px;border:1px dashed #b9bec7;color:var(--sub);font-size:12px;display:grid;place-items:center;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:rgba(30,30,30,.9);color:#fff;
  font-size:13px;padding:9px 14px;border-radius:18px;z-index:50;max-width:86vw;text-align:center}

/* 3本線で切り替える（版6） */
.tabs{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.3)}
.tp{background:#fff;border-radius:0 0 14px 14px;padding:calc(env(safe-area-inset-top) + 10px) 10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.tp-in{max-width:640px;margin:0 auto}
.ti{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:10px;-webkit-tap-highlight-color:transparent}
.ti b{display:block;font-size:16px}
.ti span{display:block;font-size:12px;color:var(--sub);margin-top:1px}
.ti.on{background:#eaf0fd}
.ti.on b{color:var(--link)}
.view{max-width:640px;margin:0 auto;padding:10px 10px calc(env(safe-area-inset-bottom) + 40px)}
.hint{font-size:12px;color:var(--sub);margin:2px 4px 10px;line-height:1.5}
.addmemo{display:block;width:100%;padding:13px;border-radius:10px;background:#2b3a55;color:#fff;font-size:15px;font-weight:600;margin:0 0 10px}
.memo{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 8px}
.memo b{display:block;font-size:15px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--sub);line-height:1.5;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.memo time{display:block;font-size:11px;color:var(--sub);margin-top:6px}
#meText{flex:1;border:0;outline:none;resize:none;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);font-size:16px;line-height:1.7;font-family:inherit;color:var(--ink);background:#fff}
.gh{font-size:13px;font-weight:700;color:var(--sub);margin:18px 4px 6px}
.gh:first-child{margin-top:6px}
.term{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 8px}
.term h3{font-size:17px;margin:0 0 2px}
.term .one{font-size:14px;font-weight:700;color:var(--link);margin:0 0 6px;line-height:1.5}
.term p{font-size:14px;line-height:1.7;margin:0 0 4px;overflow-wrap:anywhere}
.term .ex{background:#f4f5f7;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6;color:#444;margin:6px 0 2px}
.term{transition:background-color .6s}
.term.hit{background:#eaf0fd}
/* 版11（オーナー「？マーク邪魔だから色変えるだけに変更して。ポップアップのみのものを青（薄め）、説明に飛ぶものは赤（薄め）」） */
.gl{color:#e0605e;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.gfig{margin:8px 0 8px}
.gfig svg{display:block;width:100%;height:auto;border-radius:10px}
.gfig figcaption{font-size:13px;line-height:1.6;color:#444;margin-top:6px}
.gphoto{margin:8px 0 8px}
.gphoto img{display:block;width:100%;height:auto;border-radius:10px}
.gphoto.tall img{width:62%;margin:0 auto}
.gphoto figcaption{font-size:13px;line-height:1.6;color:#444;margin-top:6px}
.soon{text-align:center;color:var(--sub);padding:56px 16px;font-size:15px;line-height:1.8}

/* 用語の「？」と吹き出し（版5・2026-11-25。オーナーが見本を見て「この形で作る」）。
   四角は出さない：言葉の枠・押したときの灰色（tap-highlight）・吹き出しの枠線はなし。吹き出しは角の丸い面と、言葉を指す小さな三角 */
.tw{color:#4f95e8;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none}
.tw[aria-expanded="true"]{color:#2f6fd0}
.tip{position:absolute;z-index:4;background:#fff;color:var(--ink);border-radius:16px;padding:12px 44px 12px 14px;font-size:14px;font-weight:400;line-height:1.6;text-align:left;
  box-shadow:0 8px 24px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.1)}
.tip b{display:block;font-size:15px;font-weight:700;margin-bottom:2px;overflow-wrap:anywhere}
.tip p{margin:0;overflow-wrap:anywhere}
.tip-x{position:absolute;top:2px;right:2px;width:44px;height:44px;color:var(--sub);font-size:22px;line-height:1;outline:none;-webkit-tap-highlight-color:transparent}
.tip-t{position:absolute;width:12px;height:12px;background:#fff;transform:rotate(45deg)}
/* 版12：台の名前は薄めの緑。押すと台の説明（天井と、G数に関わる示唆のタイミング）の吹き出し。長いときは吹き出しの中だけ動く */
.dai{color:#3daa68;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none}
.dai[aria-expanded="true"]{color:#2a8a50}
/* 版15：画像つきの言葉は黄色（からし色。白の上でも読めるよう濃いめ）。吹き出しの写真は横いっぱい */
.tw.ty{color:#d29e00}
.tw.ty[aria-expanded="true"]{color:#a87e00}
.tip .timg{margin:6px -32px 6px 0}
.tip .timg img{display:block;width:100%;height:auto;border-radius:10px;background:#f2f3f5}
.tip .timg figcaption{font-size:12px;color:var(--sub);margin-top:3px}
body.tipon .fab{opacity:0;pointer-events:none}
.tip .dai-in{max-height:min(62vh,560px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tip .dai-in h4{margin:10px 0 2px;font-size:13px;font-weight:700;color:#2a8a50}
.tip .dai-in h5{margin:8px 0 1px;font-size:13.5px;font-weight:700;color:var(--ink)}
.tip .dai-in p{padding-left:1em;text-indent:-1em}
.tip .dai-in p::before{content:'・'}
/* 版13：天井は「色つきの見出し＋値」の行。リセット＝橙・通常＝緑・特別条件＝紫・〜後＝青 */
.tip .dai-in .cr{display:flex;align-items:flex-start;gap:8px;margin:6px 0}
.tip .dai-in .ck{flex:none;width:8.8em;box-sizing:border-box;text-align:center;font-size:11.5px;font-weight:700;line-height:1.45;padding:2px 3px;border-radius:6px;margin-top:1px}
.tip .dai-in .cv{flex:1;min-width:0;overflow-wrap:anywhere}
.tip .dai-in .cn{color:var(--sub)}
.k-re{color:#c2410c;background:#fdeadb}
.k-tu{color:#1f7a45;background:#e1f3e7}
.k-sp{color:#6d28d9;background:#efe7fd}
.k-af{color:#1d64a8;background:#e2edf9}
.k-ot{color:#555;background:#eee}
/* 版14：吹き出しの文は言葉のまとまり（.w）ごとに改行する。見出しの札は1行のまま */
.tip .w{display:inline-block;max-width:100%;text-indent:0}
/* 版17：用語集も同じ（オーナー「途中で文が途切れるのめっちゃ嫌い」） */
#termsV .w{display:inline-block;max-width:100%}
.tip .dai-in{margin-right:-32px}
.tip .dai-in .cl{display:block}
.tip .dai-in .cnote{display:block;color:var(--sub);font-size:13px;line-height:1.5}
.tip .dai-in .ck{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="icon-btn" id="tabBtn" aria-label="切り替え" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 id="ttl">狙い目ノート</h1>
    <span class="sp"></span>
    <button class="icon-btn" id="menuBtn" aria-label="メニュー">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>

  $('hyWait').textContent = '表を出しています…'; $('hyWait').classList.remove('hide');
  var old = $('hyv').querySelector('iframe'); if (old) old.remove();
  $('hyv').classList.remove('hide'); document.body.style.overflow = 'hidden';
  history.pushState({ h: 1 }, '');
  hyFromCache(n, tb.at).then(function (html) {
    if (html) return html;
    return call({ a: 'hyou', k: S.key, name: n, raw: raw ? 1 : 0 }).then(function (r) {
      if (!r.ok) throw { m: r.msg || 'うまくいきませんでした' };
      return (r.h ? Promise.resolve(r.h) : gunzip(r.d)).then(function (h) { hyToCache(n, r.at, h); return h; });

/* 期待値表の中の道具が入れた数字を、このスマホに控える（版4）。表は外と切りはなした枠なので、枠の中には残せない。
   受けるのは今開いている枠からの「控えて（save）」「出して（load）」だけ。控えの名前は英数字40字まで、中身は2万字まで */
window.addEventListener('message', function (e) {
  var f = $('hyv').querySelector('iframe'), m = e.data;
  if (!f || e.source !== f.contentWindow || !m || typeof m !== 'object' || typeof m.key !== 'string' || !/^[A-Za-z0-9_-]{1,40}$/.test(m.key)) return;
  if (m.t === 'save' && typeof m.v === 'string' && m.v.length <= 20000) ls('tool_' + m.key, m.v);
  else if (m.t === 'load') f.contentWindow.postMessage({ t: 'loaded', key: m.key, v: ls('tool_' + m.key) || '' }, '*');
});

window.addEventListener('popstate', function () {
  if (!$('hyv').classList.contains('hide')) closeHyou();
  else if (!$('viewer').classList.contains('hide')) closeViewer();
  else if (!$('compose').classList.contains('hide')) closeCompose();

});
document.addEventListener('keydown', function (e) {

  if ($('viewer').classList.contains('hide')) return;
  if (e.key === 'Escape') history.back();

  if (e.key === 'ArrowLeft') $('vPrev').click();
});

/* ---------- メモ（版6）：このスマホの中だけに残す。書いたらすぐ控える。空のまま閉じたメモは残さない ---------- */
var ME = { id: '', t: 0 };
function memos() { try { var a = JSON.parse(ls('memos') || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function nowLocal() {
  var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + 'T' + z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
}
function renderMemos() {
  var a = memos().sort(function (x, y) { return (y.o || 0) - (x.o || 0); });
  var h = '<p class="hint">ここに書いたメモは、このスマホの中だけに残ります。ほかの人には見えません。</p><button class="addmemo" data-m="">＋ 新しいメモ</button>';
  if (!a.length) h += '<div class="empty">まだメモがありません</div>';
  a.forEach(function (m) {
    var l = String(m.t).replace(/^\s+/, '').split('\n'), rest = l.slice(1).join('\n').trim();
    h += '<button class="memo" data-m="' + esc(m.id) + '"><b>' + esc(l[0]) + '</b>' + (rest ? '<span>' + esc(rest) + '</span>' : '') + '<time>' + esc(fmt(m.at)) + '</time></button>';
  });
  $('memoV').innerHTML = h;
}
$('memoV').addEventListener('click', function (e) { var b = e.target.closest('[data-m]'); if (b) openMemo(b.dataset.m); });
function openMemo(id) {
  var m = id ? memos().filter(function (x) { return x.id === id; })[0] : null;
  ME.id = m ? m.id : 'm' + Date.now();
  $('meText').value = m ? m.t : '';
  $('medit').classList.remove('hide');
  history.pushState({ m: 1 }, '');
  if (!m) setTimeout(function () { $('meText').focus(); }, 50);
}
function saveMemo() {
  clearTimeout(ME.t);
  if (!ME.id) return;
  var v = $('meText').value, a = memos().filter(function (x) { return x.id !== ME.id; });
  if (v.trim()) a.push({ id: ME.id, t: v, at: nowLocal(), o: Date.now() });
  if (ls('memos', JSON.stringify(a)) === null) toast('メモを残せませんでした。スマホの空きを確かめてください', 3200);
}
function closeMemo() { saveMemo(); ME.id = ''; $('medit').classList.add('hide'); renderMemos(); }

$('meDel').addEventListener('click', function () {
  if (!window.confirm('このメモを消します。よろしいですか？')) return;
  $('meText').value = ''; history.back();
});

function goGloss(w) {

}

  var by = {}, k = 0;
  TALL.forEach(function (t) { if (t.post) return; by[t.w] = { one: GLOSS_ONE[t.w] || t.one || '', d: t.d, pic: t.pic }; });
  Object.keys(GLOSS_NEW).forEach(function (w) { by[w] = GLOSS_NEW[w]; });
  $('termsV').innerHTML = GLOSS.map(function (g) {
    return '<div class="gh">' + esc(g[0]) + '</div>' + g[1].map(function (w) {
      var t = by[w]; if (!t) return '';
      GL_N[w] = k;
      return '<div class="term" id="gl-' + (k++) + '"><h3>' + esc(w) + '</h3>' + (t.one ? '<div class="one">' + wj(t.one) + '</div>' : '') + t.d.map(function (l) {
        if (l && typeof l === 'object') return l.photo ? gphoto(l) : gfig(l);
        var m = /^(.*?)、?(「.+」)$/.exec(l);
        if (!m) return '<p>' + wj(l) + '</p>';
        return (m[1] ? '<p>' + wj(m[1]) + '</p>' : '') + '<div class="ex">' + wj('例：' + m[2]) + '</div>';
      }).join('') + (TIMG[w] || t.pic || []).map(function (x) {   /* 版15：画像つきの言葉は用語集にも同じ写真（版16：示唆の例の写真も） */
        return '<figure class="gphoto"><img src="' + x[0] + '" width="' + x[1] + '" height="' + x[2] + '" alt="' + esc(w) + '" loading="lazy" decoding="async"><figcaption>' + wj(x[3]) + '</figcaption></figure>';
      }).join('') + '</div>';
    }).join('');
  }).join('');
}

/* ---------- 書く・直す・消す（書く合言葉の人だけ） ---------- */
var C = { id: '', imgs: [] };
var PM = null;
function postMenu(p) { PM = p; $('pmenu').classList.remove('hide'); }
$('pClose').addEventListener('click', function () { $('pmenu').classList.add('hide'); });
$('pmenu').addEventListener('click', function (e) { if (e.target === $('pmenu')) $('pmenu').classList.add('hide'); });
$('pEdit').addEventListener('click', function () { $('pmenu').classList.add('hide'); if (PM) openCompose(PM); });
$('pDel').addEventListener('click', function () {
  $('pmenu').classList.add('hide');
  if (!PM || !window.confirm('この投稿を消します。よろしいですか？')) return;
  call({ a: 'del', k: S.key, id: PM.id }).then(function (r) { toast(r.ok ? '消しました' : (r.msg || 'うまくいきませんでした')); if (r.ok) refresh(true); })
    .catch(function () { toast('つながりませんでした'); });
});
$('fab').addEventListener('click', function () { openCompose(null); });
function openCompose(p) {
  C.id = p ? p.id : '';
  C.imgs = p ? p.imgs.map(function (im) { return { id: im.id, w: im.w, h: im.h }; }) : [];
  $('cTitle').textContent = p ? 'ノートを直す' : 'ノートを書く';
  $('cSend').textContent = p ? '直す' : '投稿';
  var f = p ? fields(p) : {};
  F.forEach(function (x) { $('f_' + x[0]).value = f[x[0]] || ''; });
  /* ツールリンクの下に、上がっている期待値表をえらんで足す欄（版3） */
  var tb = S.tb.filter(function (x) { return String(x.n).charAt(0) !== '_'; }).sort(function (a, b) { return String(a.t || a.n).localeCompare(String(b.t || b.n), 'ja'); });
  $('f_tpick').innerHTML = '<option value="">＋ 期待値表を足す</option>' + tb.map(function (x) { return '<option value="' + esc(x.n) + '">' + esc(x.t || x.n) + '</option>'; }).join('');
  $('f_tpick').classList.toggle('hide', !tb.length);
  strip();
  $('compose').classList.remove('hide');
  $('compose').querySelector('.cbody').scrollTop = 0;
  F.forEach(function (x) { grow($('f_' + x[0])); });
  history.pushState({ c: 1 }, '');
}
/* 書く欄は、書いた分だけ縦にのびる */
function grow(el) { if (el.tagName !== 'TEXTAREA') return; el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }
$('compose').addEventListener('input', function (e) { grow(e.target); });
function closeCompose() { $('compose').classList.add('hide'); }
$('f_tpick').addEventListener('change', function () {
  var n = this.value, el = $('f_t'), v = el.value.replace(/\s+$/, '');
  this.value = '';
  if (!n || v.split('\n').some(function (l) { var m = HY.exec(l); return m && m[1] === n; })) return;
  el.value = (v ? v + '\n' : '') + '期待値表:' + n; grow(el);
});
$('cCancel').addEventListener('click', function () { history.back(); });
function strip() {
  var s = $('cStrip'); s.textContent = '';
  C.imgs.forEach(function (it, i) {
    var d = document.createElement('div'); d.className = 'p';
    var img = document.createElement('img');
    if (it.url) img.src = it.url; else getImg(it.id).then(function (u) { if (u) img.src = u; });
    var x = document.createElement('button'); x.textContent = '×'; x.setAttribute('aria-label', 'この画像を外す');
    x.onclick = function () { C.imgs.splice(i, 1); strip(); };
    d.appendChild(img); d.appendChild(x); s.appendChild(d);
  });
  var add = document.createElement('button'); add.className = 'addimg'; add.textContent = '写真を足す';
  add.onclick = function () { $('cFile').click(); };
  s.appendChild(add);
}
$('cFile').addEventListener('change', function () {
  Array.prototype.forEach.call(this.files, function (f) { C.imgs.push({ file: f, url: URL.createObjectURL(f) }); });
  this.value = ''; strip();
});
function shrink(it) {
  /* 送る前にスマホの中で小さくする（幅1280・高さ2600まで。JPEG） */
  return new Promise(function (res, rej) {
    var img = new Image();
    img.onload = function () {
      var r = Math.min(1, 1280 / img.naturalWidth, 2600 / img.naturalHeight);
      var w = Math.round(img.naturalWidth * r), h = Math.round(img.naturalHeight * r);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      res({ m: 'image/jpeg', w: w, h: h, d: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = rej;
    img.src = it.url;
  });
}
$('cSend').addEventListener('click', function () {
  var f = {}, any = false;
  F.forEach(function (x) { var v = $('f_' + x[0]).value.replace(/\s+$/, ''); f[x[0]] = v; if (v.trim()) any = true; });
  if (!any && !C.imgs.length) { toast('文か写真を入れてください'); return; }
  var btn = this; btn.disabled = true; btn.textContent = '送っています…';
  Promise.all(C.imgs.map(function (it) { return it.file ? shrink(it) : Promise.resolve({ id: it.id, w: it.w, h: it.h }); }))
    .then(function (imgs) { return call({ a: C.id ? 'edit' : 'add', k: S.key, id: C.id, f: f, imgs: imgs }); })
    .then(function (r) {
      if (!r.ok) { toast(r.msg || 'うまくいきませんでした', 3000); return; }
      toast(C.id ? '直しました' : '投稿しました');
      history.back(); window.scrollTo(0, 0); refresh(true);
    })
    .catch(function () { toast('送れませんでした。電波を確かめて、もう一度押してください', 3200); })
    .then(function () { btn.disabled = false; btn.textContent = C.id ? '直す' : '投稿'; });
});

/* ---------- はじめ ---------- */
setTab(TAB);
if (S.key) { render(); refresh(false); } else showLock('');
if ('serviceWorker' in navigator && !LOCAL) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
  /* 新しい版が届いたら、書いている途中でなければ開き直す */
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (e.data === 'nerainote-new' && $('compose').classList.contains('hide') && $('medit').classList.contains('hide')) location.reload();
  });
}
})();
</script>
